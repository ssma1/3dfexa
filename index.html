<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Игра</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .mi {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 28px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            color: white;
            pointer-events: none;
        }

        /* Стартовый экран */
        #start-screen {
            position: fixed;
            inset: 0;
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        #start-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.15s;
        }
        #start-btn:active { transform: scale(0.92); }
        #start-btn .mi { font-size: 48px; }

        /* Джойстик */
        #joystick-container {
            position: absolute;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        /* Круглые кнопки действий */
        .action-btn {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(2px);
            pointer-events: auto;
            touch-action: manipulation;
        }
        .action-btn .mi { font-size: 36px; }
        .action-btn:active { background: rgba(255, 255, 255, 0.45); transform: scale(0.95); }
        .action-btn.active { background: rgba(80, 200, 255, 0.55); border-color: #50c8ff; }

        #jump-btn { bottom: 60px; right: 40px; }
        #fly-btn { bottom: 160px; right: 40px; }
        #delete-mode-btn { bottom: 260px; right: 40px; }

        #settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            cursor: pointer;
            backdrop-filter: blur(2px);
            touch-action: manipulation;
        }
        #settings-btn .mi { font-size: 26px; }

        /* Панель настроек */
        #settings-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 280px;
            max-width: calc(100vw - 40px);
            background: rgba(30, 30, 30, 0.92);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 16px 18px;
            color: #eee;
            z-index: 210;
            display: none;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            font-size: 13px;
        }
        #settings-panel h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }
        #settings-panel h3 .mi { font-size: 20px; }
        .setting-row { margin-bottom: 14px; }
        .setting-row label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #bbb;
        }
        .setting-row label .mi { font-size: 18px; color: #7ecbff; }
        .setting-row .val { color: #7ecbff; font-variant-numeric: tabular-nums; }
        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #50c8ff;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(80,200,255,0.8);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%;
            background: #50c8ff; border: none; cursor: pointer;
        }

        @media (pointer: fine) {
            #joystick-container { display: none !important; }
            #jump-btn, #fly-btn, #delete-mode-btn { display: none !important; }
        }
        @media (pointer: coarse) {
            #joystick-container { display: block; }
            #jump-btn, #fly-btn, #delete-mode-btn { display: flex; }
        }

        #loading {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 50;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            display: none;
        }

        /* --- Корзина (кнопка удаления) --- */
        #trash-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 250;
            cursor: pointer;
            backdrop-filter: blur(3px);
            transition: opacity 0.4s ease, transform 0.4s ease, background 0.25s ease, border-color 0.25s ease;
            opacity: 0;
            pointer-events: none;
            touch-action: manipulation;
        }
        #trash-btn .mi {
            font-size: 34px;
            color: #eee;
            transition: color 0.25s ease;
        }
        #trash-btn.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #trash-btn.hot {
            background: rgba(220, 40, 40, 0.7);
            border-color: #ff4b4b;
        }
        #trash-btn.hot .mi { color: #fff; }
        #trash-btn:active { transform: translateX(-50%) translateY(0) scale(0.92); }

        /* Текст под корзиной (небольшой, опционально) */
        #trash-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 250;
            white-space: nowrap;
        }
        #trash-label.visible { opacity: 1; }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn"><span class="mi">play_arrow</span></button>
    </div>

    <!-- Мобильное управление -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn" class="action-btn"><span class="mi">north</span></div>
    <div id="fly-btn" class="action-btn"><span class="mi">flight</span></div>
    <div id="delete-mode-btn" class="action-btn"><span class="mi">delete</span></div>

    <!-- Настройки -->
    <div id="settings-btn"><span class="mi">settings</span></div>
    <div id="settings-panel">
        <h3><span class="mi">tune</span></h3>
        <div class="setting-row">
            <label><span class="mi">height</span><span class="val" id="player-size-val">1.00</span></label>
            <input type="range" id="player-size" min="0.3" max="3" step="0.05" value="1">
        </div>
        <div class="setting-row">
            <label><span class="mi">landscape</span><span class="val" id="statue-size-val">1.00</span></label>
            <input type="range" id="statue-size" min="0.5" max="4" step="0.05" value="1">
        </div>
        <div class="setting-row">
            <label><span class="mi">speed</span><span class="val" id="speed-val">5.0</span></label>
            <input type="range" id="speed" min="1" max="20" step="0.5" value="5">
        </div>
        <div class="setting-row">
            <label><span class="mi">arrow_upward</span><span class="val" id="fly-speed-val">5.0</span></label>
            <input type="range" id="fly-speed" min="1" max="20" step="0.5" value="5">
        </div>
    </div>

    <!-- Корзина удаления -->
    <div id="trash-btn"><span class="mi">delete</span></div>
    <div id="trash-label">Нажмите на корзину, чтобы удалить</div>

    <div id="crosshair"></div>
    <div id="loading">Загрузка модели...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer;
        let player;
        let playerBody;
        let statue;
        let mixer;

        const cam = {
            yaw: 0,
            pitch: 0,
            sensitivity: 0.0022,
            height: 1.7
        };

        const playerState = {
            velocity: new THREE.Vector3(),
            onGround: true,
            speed: 5.0,
            jumpForce: 8.0,
            gravity: 20.0,
            flying: false,
            flySpeed: 5.0,
            scale: 1.0
        };

        const statueState = { scale: 1.0, baseScale: 1.0 };

        const keys = { w:false, a:false, s:false, d:false, space:false, fly:false, sprint:false, up:false, down:false };
        let joystickInput = { x:0, y:0 };

        let joystickActive = false, joystickTouchId = null;
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const joystickHome = { left: 40, bottom: 40 };
        let joystickCenter = { x: 0, y: 0 };
        const joystickRadius = 55;

        const jumpBtn = document.getElementById('jump-btn');
        const flyBtn = document.getElementById('fly-btn');
        const deleteModeBtn = document.getElementById('delete-mode-btn');
        let jumpBtnPressed = false;
        let flyToggleOnMobile = false;

        const activeTouches = new Map();
        let cameraTouchId = null;
        let lastCameraTouchX = 0, lastCameraTouchY = 0;

        let isMouseLocked = false;

        // --- Настройки ---
        const settingsPanel = document.getElementById('settings-panel');
        const settingsBtn = document.getElementById('settings-btn');
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
                settingsPanel.style.display = 'none';
            }
        });

        // ============================================================
        //                    РЕЖИМ УДАЛЕНИЯ
        // ============================================================
        const deleteState = {
            active: false,           // включён ли режим удаления
            hovered: null,           // объект, на который смотрим/навели
            hoveredMats: [],         // оригинальные материалы для восстановления
            timeoutId: null,         // таймер 3 мин
            timeoutMs: 3 * 60 * 1000 // 3 минуты
        };

        const trashBtn = document.getElementById('trash-btn');
        const trashLabel = document.getElementById('trash-label');

        // Raycaster для выбора объектов
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2(0, 0); // по центру экрана (прицел)

        // Вспомогательная функция: считается ли объект удаляемым
        function isDeletable(obj) {
            let o = obj;
            while (o) {
                if (o.userData && o.userData.deletable) return true;
                o = o.parent;
            }
            return false;
        }

        // Найти «корневой» удаляемый объект (тот, у которого deletable=true)
        function findDeletableRoot(obj) {
            let o = obj;
            let lastDeletable = null;
            while (o) {
                if (o.userData && o.userData.deletable) lastDeletable = o;
                o = o.parent;
            }
            return lastDeletable;
        }

        // Подсветка объекта красным
        function highlightObject(obj) {
            clearHighlight();
            if (!obj) return;
            deleteState.hovered = obj;
            deleteState.hoveredMats = [];
            obj.traverse((node) => {
                if (node.isMesh && node.material) {
                    const mats = Array.isArray(node.material) ? node.material : [node.material];
                    mats.forEach((mat) => {
                        // сохраняем оригинальные параметры, чтобы вернуть
                        const orig = {
                            mat: mat,
                            emissive: mat.emissive ? mat.emissive.clone() : null,
                            emissiveIntensity: mat.emissiveIntensity !== undefined ? mat.emissiveIntensity : 1,
                            color: mat.color ? mat.color.clone() : null
                        };
                        deleteState.hoveredMats.push(orig);

                        if (mat.emissive) {
                            mat.emissive.setHex(0xff2222);
                            mat.emissiveIntensity = 0.9;
                        } else if (mat.color) {
                            mat.color.setHex(0xff3333);
                        }
                    });
                }
            });
            trashBtn.classList.add('hot');
        }

        function clearHighlight() {
            if (deleteState.hoveredMats.length) {
                deleteState.hoveredMats.forEach((o) => {
                    if (o.emissive) {
                        o.mat.emissive.copy(o.emissive);
                        o.mat.emissiveIntensity = o.emissiveIntensity;
                    }
                    if (o.color) o.mat.color.copy(o.color);
                });
                deleteState.hoveredMats = [];
            }
            deleteState.hovered = null;
            trashBtn.classList.remove('hot');
        }

        // Войти в режим удаления (показать корзину)
        function enterDeleteMode() {
            if (deleteState.active) return;
            deleteState.active = true;
            trashBtn.classList.add('visible');
            trashLabel.classList.add('visible');
            resetDeleteTimeout();
        }

        // Выйти из режима удаления (спрятать корзину и снять подсветку)
        function exitDeleteMode() {
            if (!deleteState.active) return;
            deleteState.active = false;
            trashBtn.classList.remove('visible', 'hot');
            trashLabel.classList.remove('visible');
            clearHighlight();
            clearTimeout(deleteState.timeoutId);
            deleteState.timeoutId = null;
        }

        // Сброс таймера на 3 минуты
        function resetDeleteTimeout() {
            clearTimeout(deleteState.timeoutId);
            deleteState.timeoutId = setTimeout(() => {
                exitDeleteMode();
            }, deleteState.timeoutMs);
        }

        // Обновить подсветку под прицелом
        function updateDeleteHover() {
            if (!deleteState.active) return;

            raycaster.setFromCamera(pointerNDC, camera);
            raycaster.far = 100;
            const intersects = raycaster.intersectObjects(scene.children, true);

            let target = null;
            for (const hit of intersects) {
                if (hit.object === playerBody) continue; // не подсвечиваем себя
                if (hit.object.isLine || hit.object.isPoints) continue;
                if (hit.object === trashBtn) continue;
                // Проверяем, что это удаляемое (по цепочке родителей)
                if (isDeletable(hit.object)) {
                    target = findDeletableRoot(hit.object);
                    break;
                }
            }

            if (target !== deleteState.hovered) {
                if (target) {
                    highlightObject(target);
                } else {
                    clearHighlight();
                }
            }
        }

        // Удалить выбранный объект
        function deleteHovered() {
            if (!deleteState.hovered) return;
            const obj = deleteState.hovered;
            clearHighlight();
            if (obj.parent) obj.parent.remove(obj);
            // Освобождаем ресурсы
            obj.traverse((node) => {
                if (node.isMesh) {
                    if (node.geometry) node.geometry.dispose();
                    if (node.material) {
                        const mats = Array.isArray(node.material) ? node.material : [node.material];
                        mats.forEach(m => m.dispose());
                    }
                }
            });
            // Проверяем — если удалили статую, обнулим ссылку
            if (obj === statue || (statue && obj.children && obj.children.includes(statue))) {
                statue = null;
            }
            // После удаления остаёмся в режиме, но корзина снова обычная
            resetDeleteTimeout();
        }

        // Клик по корзине — удалить
        trashBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (deleteState.hovered) {
                deleteHovered();
            } else {
                // Если ничего не наведено — просто выходим
                exitDeleteMode();
            }
        });
        trashBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (deleteState.hovered) deleteHovered();
            else exitDeleteMode();
        }, { passive: false });

        // ============================================================
        //                   КОНЕЦ РЕЖИМА УДАЛЕНИЯ
        // ============================================================

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6a6a6a);
            scene.fog = new THREE.Fog(0x6a6a6a, 40, 200);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.65));

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            dirLight.shadow.camera.left = -60;
            dirLight.shadow.camera.right = 60;
            dirLight.shadow.camera.top = 60;
            dirLight.shadow.camera.bottom = -60;
            dirLight.shadow.camera.far = 150;
            scene.add(dirLight);

            const fill = new THREE.DirectionalLight(0xffffff, 0.4);
            fill.position.set(-20, 10, -20);
            scene.add(fill);

            const mapSize = 80;
            const platformGeo = new THREE.BoxGeometry(mapSize, 0.5, mapSize);
            const platformMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.75, metalness: 0.05 });
            const platform = new THREE.Mesh(platformGeo, platformMat);
            platform.position.y = -0.25;
            platform.receiveShadow = true;
            // Платформа НЕ удаляемая — не помечаем deletable
            scene.add(platform);

            const grid = new THREE.GridHelper(mapSize, 40, 0x555555, 0x505050);
            grid.position.y = 0.005;
            scene.add(grid);

            // Колонны — УДАЛЯЕМЫЕ
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.85 });
            const pillarGeo = new THREE.BoxGeometry(2, 6, 2);
            [[30,30],[-30,30],[30,-30],[-30,-30]].forEach(([x,z]) => {
                const p = new THREE.Mesh(pillarGeo.clone(), pillarMat.clone());
                p.position.set(x, 3, z);
                p.castShadow = true;
                p.receiveShadow = true;
                p.userData.deletable = true;
                scene.add(p);
            });

            // Игрок
            player = new THREE.Group();
            player.position.set(0, 0, 8);
            player.userData.deletable = false;
            scene.add(player);

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: 0.6 });
            playerBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 4, 8), bodyMat);
            playerBody.position.y = 0.8;
            playerBody.castShadow = true;
            playerBody.receiveShadow = true;
            playerBody.userData.deletable = false;
            player.add(playerBody);

            // Загрузка статуи
            const loader = new GLTFLoader();
            loader.load(
                'fexa_bikini.glb',
                (gltf) => {
                    const modelRoot = gltf.scene;
                    modelRoot.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });

                    const box = new THREE.Box3().setFromObject(modelRoot);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const targetHeight = 4;
                    const autoScale = targetHeight / (size.y || 1);
                    statueState.baseScale = autoScale;
                    statueState.scale = 1.0;
                    modelRoot.scale.setScalar(autoScale);

                    const box2 = new THREE.Box3().setFromObject(modelRoot);
                    const center = new THREE.Vector3();
                    box2.getCenter(center);
                    modelRoot.position.x = -center.x;
                    modelRoot.position.z = -center.z;
                    modelRoot.position.y = -box2.min.y;

                    const statueGroup = new THREE.Group();
                    statueGroup.position.set(0, 0, -12);
                    statueGroup.add(modelRoot);
                    // Статуя — УДАЛЯЕМАЯ
                    statueGroup.userData.deletable = true;
                    scene.add(statueGroup);
                    statue = statueGroup;

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(modelRoot);
                    }

                    document.getElementById('loading').style.display = 'none';
                },
                (xhr) => {
                    if (xhr.total) {
                        const p = (xhr.loaded / xhr.total * 100).toFixed(0);
                        document.getElementById('loading').textContent = `Загрузка: ${p}%`;
                    }
                },
                (err) => {
                    console.error(err);
                    document.getElementById('loading').textContent = 'Ошибка загрузки fexa_bikini.glb';
                }
            );

            setupSettings();
            setupControls();
            window.addEventListener('resize', onWindowResize);
        }

        function setupSettings() {
            const playerSizeInput = document.getElementById('player-size');
            const playerSizeVal = document.getElementById('player-size-val');
            playerSizeInput.addEventListener('input', () => {
                const v = parseFloat(playerSizeInput.value);
                playerSizeVal.textContent = v.toFixed(2);
                playerState.scale = v;
                player.scale.setScalar(v);
            });

            const statueSizeInput = document.getElementById('statue-size');
            const statueSizeVal = document.getElementById('statue-size-val');
            statueSizeInput.addEventListener('input', () => {
                const v = parseFloat(statueSizeInput.value);
                statueSizeVal.textContent = v.toFixed(2);
                statueState.scale = v;
                if (statue) statue.scale.setScalar(statueState.baseScale * v);
            });

            const speedInput = document.getElementById('speed');
            const speedVal = document.getElementById('speed-val');
            speedInput.addEventListener('input', () => {
                const v = parseFloat(speedInput.value);
                speedVal.textContent = v.toFixed(1);
                playerState.speed = v;
            });

            const flySpeedInput = document.getElementById('fly-speed');
            const flySpeedVal = document.getElementById('fly-speed-val');
            flySpeedInput.addEventListener('input', () => {
                const v = parseFloat(flySpeedInput.value);
                flySpeedVal.textContent = v.toFixed(1);
                playerState.flySpeed = v;
            });
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = true; break;
                    case 'KeyA': keys.a = true; break;
                    case 'KeyS': keys.s = true; break;
                    case 'KeyD': keys.d = true; break;
                    case 'Space': keys.space = true; e.preventDefault(); break;
                    case 'KeyF': keys.fly = true; e.preventDefault(); break;
                    case 'ShiftLeft':
                    case 'ShiftRight': keys.sprint = true; break;
                    case 'KeyE': keys.up = true; break;
                    case 'KeyQ': keys.down = true; break;
                }
            });
            window.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = false; break;
                    case 'KeyA': keys.a = false; break;
                    case 'KeyS': keys.s = false; break;
                    case 'KeyD': keys.d = false; break;
                    case 'Space': keys.space = false; break;
                    case 'KeyF': keys.fly = false; break;
                    case 'ShiftLeft':
                    case 'ShiftRight': keys.sprint = false; break;
                    case 'KeyE': keys.up = false; break;
                    case 'KeyQ': keys.down = false; break;
                }
            });

            const canvas = renderer.domElement;

            // --- ПК: pointer lock ---
            canvas.addEventListener('click', (e) => {
                // Если активен режим удаления — клик обрабатывается отдельно ниже
                if (deleteState.active) return;
                if (!isMouseLocked) canvas.requestPointerLock();
            });
            document.addEventListener('pointerlockchange', () => {
                isMouseLocked = (document.pointerLockElement === canvas);
            });
            document.addEventListener('mousemove', (e) => {
                if (!isMouseLocked) {
                    // Если режим удаления — обновляем ховер по курсору
                    if (deleteState.active) {
                        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
                        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
                        updateDeleteHover();
                    }
                    return;
                }
                cam.yaw -= e.movementX * cam.sensitivity;
                cam.pitch -= e.movementY * cam.sensitivity;
                cam.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, cam.pitch));
                resetDeleteTimeout();
            });

            // ПКМ — вход в режим удаления (даже в pointer lock)
            document.addEventListener('mousedown', (e) => {
                if (e.button === 2) { // правая
                    e.preventDefault();
                    if (!deleteState.active) {
                        enterDeleteMode();
                        // Обновляем ховер: в pointer lock прицел по центру
                        pointerNDC.set(0, 0);
                        updateDeleteHover();
                    } else {
                        // Если уже в режиме — клик по объекту под прицелом
                        pointerNDC.set(0, 0);
                        updateDeleteHover();
                        if (deleteState.hovered) {
                            // Ничего не удаляем сразу — ждём клика по корзине
                            // Просто подсветили (уже подсвечено)
                        }
                    }
                    resetDeleteTimeout();
                }
            });
            // Блокируем контекстное меню
            document.addEventListener('contextmenu', (e) => {
                // разрешаем только вне игры (на UI)
                if (e.target === canvas) e.preventDefault();
            });

            // ЛКМ — если режим удаления активен и не в pointer lock — обновляем ховер и вход
            canvas.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                if (deleteState.active) {
                    // В режиме удаления: клик по объекту под курсором
                    if (!isMouseLocked) {
                        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
                        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
                        updateDeleteHover();
                    } else {
                        pointerNDC.set(0, 0);
                        updateDeleteHover();
                    }
                    resetDeleteTimeout();
                    return;
                }
                // Если не в режиме — проверяем, попали ли по удаляемому объекту (при клике ЛКМ)
                // В pointer lock клик ЛКМ обычно = захват. Но если уже захвачено — попробуем войти в режим.
                // Для простоты: ЛКМ по объекту (вне pointer lock) — сразу вход в режим удаления
                if (!isMouseLocked) {
                    const rect = canvas.getBoundingClientRect();
                    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(pointerNDC, camera);
                    raycaster.far = 100;
                    const hits = raycaster.intersectObjects(scene.children, true);
                    for (const h of hits) {
                        if (h.object === playerBody) continue;
                        if (isDeletable(h.object)) {
                            enterDeleteMode();
                            pointerNDC.set(
                                ((e.clientX - rect.left) / rect.width) * 2 - 1,
                                -((e.clientY - rect.top) / rect.height) * 2 + 1
                            );
                            updateDeleteHover();
                            return;
                        }
                    }
                }
            });

            // --- Мобильные касания ---
            canvas.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                }

                // Если режим удаления активен — касание = выбор объекта под пальцем
                if (deleteState.active) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        const t = e.changedTouches[i];
                        pointerNDC.x = (t.clientX / window.innerWidth) * 2 - 1;
                        pointerNDC.y = -(t.clientY / window.innerHeight) * 2 + 1;
                        updateDeleteHover();
                        resetDeleteTimeout();
                        e.preventDefault();
                    }
                    return;
                }

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    const inJoystickZone = t.clientX < window.innerWidth * 0.5 &&
                                           t.clientY > window.innerHeight * 0.45;

                    if (!joystickActive && inJoystickZone) {
                        joystickActive = true;
                        joystickTouchId = t.identifier;
                        joystickContainer.style.display = 'block';
                        joystickContainer.style.left = joystickHome.left + 'px';
                        joystickContainer.style.bottom = joystickHome.bottom + 'px';
                        joystickContainer.style.top = 'auto';
                        const rect = joystickContainer.getBoundingClientRect();
                        joystickCenter.x = rect.left + rect.width / 2;
                        joystickCenter.y = rect.top + rect.height / 2;
                        joystickKnob.style.transform = 'translate(-50%, -50%)';
                        joystickInput = { x: 0, y: 0 };
                        e.preventDefault();
                    } else if (cameraTouchId === null) {
                        cameraTouchId = t.identifier;
                        lastCameraTouchX = t.clientX;
                        lastCameraTouchY = t.clientY;
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (activeTouches.has(t.identifier)) {
                        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                    }

                    if (joystickActive && t.identifier === joystickTouchId) {
                        let dx = t.clientX - joystickCenter.x;
                        let dy = t.clientY - joystickCenter.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > joystickRadius) {
                            dx = (dx / dist) * joystickRadius;
                            dy = (dy / dist) * joystickRadius;
                        }
                        joystickInput.x = dx / joystickRadius;
                        joystickInput.y = dy / joystickRadius;
                        joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        e.preventDefault();
                    }

                    if (t.identifier === cameraTouchId) {
                        const dx = t.clientX - lastCameraTouchX;
                        const dy = t.clientY - lastCameraTouchY;
                        lastCameraTouchX = t.clientX;
                        lastCameraTouchY = t.clientY;
                        const sens = 0.004;
                        cam.yaw -= dx * sens;
                        cam.pitch -= dy * sens;
                        cam.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, cam.pitch));
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    activeTouches.delete(t.identifier);
                    if (t.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        joystickInput = { x: 0, y: 0 };
                        joystickContainer.style.display = 'none';
                        joystickKnob.style.transform = 'translate(-50%, -50%)';
                    }
                    if (t.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };
            canvas.addEventListener('touchend', endTouch);
            canvas.addEventListener('touchcancel', endTouch);

            // --- Кнопки ---
            const bindBtn = (el, onDown, onUp) => {
                el.addEventListener('touchstart', (e) => { onDown(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
                el.addEventListener('touchend', (e) => { onUp(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
                el.addEventListener('touchcancel', (e) => { onUp(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
                el.addEventListener('mousedown', (e) => { onDown(); e.preventDefault(); });
                el.addEventListener('mouseup', (e) => { onUp(); e.preventDefault(); });
                el.addEventListener('mouseleave', () => onUp());
            };

            bindBtn(jumpBtn, () => jumpBtnPressed = true, () => jumpBtnPressed = false);

            const toggleFly = () => {
                flyToggleOnMobile = !flyToggleOnMobile;
                playerState.flying = flyToggleOnMobile;
                flyBtn.classList.toggle('active', playerState.flying);
            };
            flyBtn.addEventListener('touchstart', (e) => { toggleFly(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
            flyBtn.addEventListener('mousedown', (e) => { toggleFly(); e.preventDefault(); });

            // Кнопка режима удаления на мобильном — переключатель
            deleteModeBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (deleteState.active) {
                    exitDeleteMode();
                    deleteModeBtn.classList.remove('active');
                } else {
                    enterDeleteMode();
                    deleteModeBtn.classList.add('active');
                    pointerNDC.set(0, 0); // ховер по центру
                    updateDeleteHover();
                }
            }, { passive: false });
            deleteModeBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (deleteState.active) {
                    exitDeleteMode();
                    deleteModeBtn.classList.remove('active');
                } else {
                    enterDeleteMode();
                    deleteModeBtn.classList.add('active');
                    pointerNDC.set(0, 0);
                    updateDeleteHover();
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            updatePlayer(dt);

            // В режиме удаления: обновляем подсветку под прицелом (если pointer lock)
            if (deleteState.active) {
                if (isMouseLocked) {
                    pointerNDC.set(0, 0);
                    updateDeleteHover();
                }
            }

            renderer.render(scene, camera);
        }

        const _forward = new THREE.Vector3();
        const _right = new THREE.Vector3();
        const _move = new THREE.Vector3();

        function updatePlayer(dt) {
            if (!player) return;

            if (keys.fly) playerState.flying = true;

            let f = 0, r = 0;
            if (keys.w) f += 1;
            if (keys.s) f -= 1;
            if (keys.d) r += 1;
            if (keys.a) r -= 1;

            if (Math.abs(joystickInput.y) > 0.1) f += -joystickInput.y;
            if (Math.abs(joystickInput.x) > 0.1) r += joystickInput.x;

            const inputLen = Math.sqrt(f*f + r*r);
            if (inputLen > 1) { f /= inputLen; r /= inputLen; }

            _forward.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
            _right.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));

            _move.set(0, 0, 0);
            _move.addScaledVector(_forward, f);
            _move.addScaledVector(_right, r);
            if (_move.lengthSq() > 0) _move.normalize();

            const sprintMul = keys.sprint ? 2.0 : 1.0;

            if (playerState.flying) {
                const flySpeed = playerState.flySpeed * sprintMul;
                player.position.x += _move.x * flySpeed * dt;
                player.position.z += _move.z * flySpeed * dt;

                let vertical = 0;
                if (keys.space || jumpBtnPressed) vertical += 1;
                if (keys.down) vertical -= 1;
                player.position.y += vertical * flySpeed * dt;
                player.position.y = Math.max(0, Math.min(50, player.position.y));
            } else {
                const speed = playerState.speed * sprintMul;
                player.position.x += _move.x * speed * dt;
                player.position.z += _move.z * speed * dt;

                if ((keys.space || jumpBtnPressed) && playerState.onGround) {
                    playerState.velocity.y = playerState.jumpForce;
                    playerState.onGround = false;
                }

                playerState.velocity.y -= playerState.gravity * dt;
                player.position.y += playerState.velocity.y * dt;

                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerState.velocity.y = 0;
                    playerState.onGround = true;
                }
            }

            const limit = 39;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            const eyeHeight = 1.6 * playerState.scale;
            camera.position.set(
                player.position.x,
                player.position.y + eyeHeight,
                player.position.z
            );

            const dir = new THREE.Vector3(
                -Math.sin(cam.yaw) * Math.cos(cam.pitch),
                Math.sin(cam.pitch),
                -Math.cos(cam.yaw) * Math.cos(cam.pitch)
            );
            camera.lookAt(camera.position.clone().add(dir));

            if (mixer) mixer.update(dt);
        }

        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            } catch (err) { console.log(err); }

            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); }
                catch (err) { console.log(err); }
            }

            initScene();
            clock.start();
            animate();
        });
    </script>
</body>
</html>
