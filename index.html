<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Карта - fexa_bikini</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ccc;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
        }
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        #jump-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            backdrop-filter: blur(2px);
            pointer-events: auto;
        }
        #jump-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        #start-screen h1 {
            font-size: 24px;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        @media (pointer: fine) {
            #joystick-container, #jump-btn {
                display: none !important;
            }
        }
        @media (pointer: coarse) {
            #joystick-container, #jump-btn {
                display: flex;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Нажмите, чтобы играть на полный экран</h1>
        <button id="start-btn">Играть</button>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn">JUMP</div>

    <div id="info">WASD - движение | Space - прыжок | Колесо мыши - зум</div>
    <div id="loading">Загрузка модели...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer;
        let player;
        let model;
        let mixer;

        // --- Параметры камеры (для зума) ---
        const cameraParams = {
            minDistance: 3,      // Ближайший зум
            maxDistance: 15,     // Дальний зум
            distance: 6,         // Текущая дистанция (стартуем поближе)
            height: 3,           // Высота камеры относительно игрока
            lerpSpeed: 0.12      // Плавность следования
        };

        const playerState = {
            velocity: new THREE.Vector3(),
            onGround: true,
            speed: 5.0,
            jumpForce: 8.0,
            gravity: 20.0
        };

        const keys = { w: false, a: false, s: false, d: false, space: false };
        let joystickInput = { x: 0, y: 0 };

        let joystickActive = false;
        let joystickTouchId = null;
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickCenter = { x: 0, y: 0 };
        const joystickRadius = 50;

        const jumpBtn = document.getElementById('jump-btn');
        let jumpBtnPressed = false;

        // --- Переменные для pinch-зума ---
        const activeTouches = new Map();
        let lastPinchDistance = null;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x666666);
            scene.fog = new THREE.Fog(0x666666, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            dirLight.receiveShadow = true;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-5, 0, 5);
            scene.add(fillLight);

            // Платформа
            const platformGeometry = new THREE.BoxGeometry(30, 0.5, 30);
            const platformMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7, metalness: 0.1 });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.y = -0.25;
            platform.receiveShadow = true;
            scene.add(platform);

            // Колонны
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
            const pillarGeo = new THREE.BoxGeometry(1, 3, 1);
            [[8,8],[-8,8],[8,-8],[-8,-8]].forEach(([x,z]) => {
                const p = new THREE.Mesh(pillarGeo, pillarMat);
                p.position.set(x, 1.5, z);
                p.castShadow = true;
                p.receiveShadow = true;
                scene.add(p);
            });

            player = new THREE.Group();
            player.position.set(0, 0, 5);
            scene.add(player);

            const loader = new GLTFLoader();
            loader.load(
                'fexa_bikini.glb',
                (gltf) => {
                    model = gltf.scene;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    // model.scale.set(0.5, 0.5, 0.5); // при необходимости
                    model.position.set(0, 0, 0);
                    player.add(model);

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                    }
                    document.getElementById('loading').style.display = 'none';
                },
                (xhr) => {
                    if (xhr.total) {
                        const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                        document.getElementById('loading').textContent = `Загрузка модели: ${percent}%`;
                    }
                },
                (error) => {
                    console.error('Ошибка загрузки модели:', error);
                    document.getElementById('loading').textContent = 'Ошибка загрузки модели';
                }
            );

            window.addEventListener('resize', onWindowResize);
            setupControls();
        }

        function setupControls() {
            // Клавиатура
            window.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = true; break;
                    case 'KeyA': keys.a = true; break;
                    case 'KeyS': keys.s = true; break;
                    case 'KeyD': keys.d = true; break;
                    case 'Space': keys.space = true; e.preventDefault(); break;
                }
            });
            window.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = false; break;
                    case 'KeyA': keys.a = false; break;
                    case 'KeyS': keys.s = false; break;
                    case 'KeyD': keys.d = false; break;
                    case 'Space': keys.space = false; break;
                }
            });

            const canvas = renderer.domElement;

            // --- Зум колесиком мыши (ПК) ---
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomStep = 0.8;
                if (e.deltaY > 0) {
                    cameraParams.distance = Math.min(cameraParams.maxDistance, cameraParams.distance + zoomStep);
                } else {
                    cameraParams.distance = Math.max(cameraParams.minDistance, cameraParams.distance - zoomStep);
                }
            }, { passive: false });

            // --- Касания ---
            canvas.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    activeTouches.set(touch.identifier, { x: touch.clientX, y: touch.clientY });
                }

                // Если два пальца — это pinch-зум, отключаем джойстик
                if (activeTouches.size >= 2) {
                    if (joystickActive) {
                        joystickActive = false;
                        joystickTouchId = null;
                        joystickInput = { x: 0, y: 0 };
                        joystickContainer.style.display = 'none';
                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                    }
                    // Инициализируем начальную дистанцию
                    lastPinchDistance = getPinchDistance();
                    e.preventDefault();
                    return;
                }

                // Иначе — обычный джойстик (левая половина)
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (!joystickActive && touch.clientX < window.innerWidth / 2) {
                        joystickActive = true;
                        joystickTouchId = touch.identifier;

                        joystickContainer.style.display = 'block';
                        joystickContainer.style.left = (touch.clientX - 60) + 'px';
                        joystickContainer.style.bottom = 'auto';
                        joystickContainer.style.top = (touch.clientY - 60) + 'px';

                        const rect = joystickContainer.getBoundingClientRect();
                        joystickCenter.x = rect.left + rect.width / 2;
                        joystickCenter.y = rect.top + rect.height / 2;

                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                        joystickInput = { x: 0, y: 0 };
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                // Обновляем позиции активных касаний
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (activeTouches.has(t.identifier)) {
                        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                    }
                }

                // Pinch-зум
                if (activeTouches.size >= 2) {
                    const dist = getPinchDistance();
                    if (lastPinchDistance !== null) {
                        const delta = dist - lastPinchDistance;
                        // Чем больше раздвигаем — тем дальше камера
                        cameraParams.distance -= delta * 0.02;
                        cameraParams.distance = Math.max(
                            cameraParams.minDistance,
                            Math.min(cameraParams.maxDistance, cameraParams.distance)
                        );
                    }
                    lastPinchDistance = dist;
                    e.preventDefault();
                    return;
                }

                // Движение джойстика
                if (!joystickActive) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        let deltaX = touch.clientX - joystickCenter.x;
                        let deltaY = touch.clientY - joystickCenter.y;
                        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                        if (distance > joystickRadius) {
                            deltaX = (deltaX / distance) * joystickRadius;
                            deltaY = (deltaY / distance) * joystickRadius;
                        }
                        joystickInput.x = deltaX / joystickRadius;
                        joystickInput.y = deltaY / joystickRadius;
                        joystickKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    activeTouches.delete(t.identifier);

                    if (joystickActive && t.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        joystickInput = { x: 0, y: 0 };
                        joystickContainer.style.display = 'none';
                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                    }
                }
                if (activeTouches.size < 2) {
                    lastPinchDistance = null;
                }
            };

            canvas.addEventListener('touchend', endTouch);
            canvas.addEventListener('touchcancel', endTouch);

            // Кнопка прыжка
            jumpBtn.addEventListener('touchstart', (e) => {
                jumpBtnPressed = true;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });
            jumpBtn.addEventListener('touchend', (e) => {
                jumpBtnPressed = false;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });
            jumpBtn.addEventListener('touchcancel', (e) => {
                jumpBtnPressed = false;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });

            jumpBtn.addEventListener('mousedown', (e) => { jumpBtnPressed = true; e.preventDefault(); });
            jumpBtn.addEventListener('mouseup', (e) => { jumpBtnPressed = false; e.preventDefault(); });
            jumpBtn.addEventListener('mouseleave', () => { jumpBtnPressed = false; });
        }

        function getPinchDistance() {
            const touches = Array.from(activeTouches.values());
            if (touches.length < 2) return 0;
            const dx = touches[0].x - touches[1].x;
            const dy = touches[0].y - touches[1].y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function updatePlayer(deltaTime) {
            if (!player) return;

            let moveX = 0;
            let moveZ = 0;

            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            if (Math.abs(joystickInput.x) > 0.1) moveX += joystickInput.x;
            if (Math.abs(joystickInput.y) > 0.1) moveZ += joystickInput.y;

            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (length > 1) {
                moveX /= length;
                moveZ /= length;
            }

            const speed = playerState.speed;
            player.position.x += moveX * speed * deltaTime;
            player.position.z += moveZ * speed * deltaTime;

            // Поворот в сторону движения
            if (length > 0.1) {
                const targetAngle = Math.atan2(moveX, moveZ);
                let angleDiff = targetAngle - player.rotation.y;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                player.rotation.y += angleDiff * Math.min(1, deltaTime * 10);
            }

            // Ограничение по платформе
            const limit = 14.5;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            // Прыжок
            const jumpPressed = keys.space || jumpBtnPressed;
            if (jumpPressed && playerState.onGround) {
                playerState.velocity.y = playerState.jumpForce;
                playerState.onGround = false;
            }

            playerState.velocity.y -= playerState.gravity * deltaTime;
            player.position.y += playerState.velocity.y * deltaTime;

            if (player.position.y <= 0) {
                player.position.y = 0;
                playerState.velocity.y = 0;
                playerState.onGround = true;
            }

            // --- Камера ---
            // Смещение камеры относительно игрока с учётом дистанции и высоты
            // Камера всегда находится за спиной игрока (по направлению взгляда персонажа)
            const offset = new THREE.Vector3(0, cameraParams.height, cameraParams.distance);
            const rotatedOffset = offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            const targetCameraPos = player.position.clone().add(rotatedOffset);

            camera.position.lerp(targetCameraPos, cameraParams.lerpSpeed);

            const lookAtTarget = player.position.clone().add(new THREE.Vector3(0, 1.2, 0));
            camera.lookAt(lookAtTarget);

            if (mixer) mixer.update(deltaTime);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = Math.min(clock.getDelta(), 0.1);
            if (player) updatePlayer(deltaTime);
            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-screen').style.display = 'none';

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            } catch (err) {
                console.log('Fullscreen request failed:', err);
            }

            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); }
                catch (err) { console.log('Orientation lock failed:', err); }
            }

            initScene();
            clock.start();
            animate();
        });
    </script>
</body>
</html>
