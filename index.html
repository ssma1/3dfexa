<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Игра</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .mi {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 28px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            color: white;
            pointer-events: none;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        #start-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #start-btn .mi { font-size: 48px; }

        #joystick-container {
            position: absolute;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .action-btn {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(2px);
            pointer-events: auto;
            touch-action: manipulation;
        }
        .action-btn .mi { font-size: 36px; }
        .action-btn:active { background: rgba(255, 255, 255, 0.45); transform: scale(0.95); }
        .action-btn.active { background: rgba(80, 200, 255, 0.55); border-color: #50c8ff; }

        #jump-btn { bottom: 60px; right: 40px; }
        #fly-btn { bottom: 160px; right: 40px; }

        #settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        #settings-btn .mi { font-size: 26px; }

        #settings-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 280px;
            max-width: calc(100vw - 40px);
            background: rgba(30, 30, 30, 0.92);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 16px 18px;
            color: #eee;
            z-index: 210;
            display: none;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            font-size: 13px;
        }
        #settings-panel h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }
        #settings-panel h3 .mi { font-size: 20px; }
        .setting-row { margin-bottom: 14px; }
        .setting-row label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #bbb;
        }
        .setting-row label .mi { font-size: 18px; color: #7ecbff; }
        .setting-row .val { color: #7ecbff; font-variant-numeric: tabular-nums; }
        input[type="range"] {
            width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.2); border-radius: 2px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #50c8ff; cursor: pointer;
            box-shadow: 0 0 6px rgba(80,200,255,0.8);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%; background: #50c8ff;
            border: none; cursor: pointer;
        }

        @media (pointer: fine) {
            #joystick-container, .action-btn { display: none !important; }
        }
        @media (pointer: coarse) {
            #joystick-container { display: block; }
            #jump-btn, #fly-btn { display: flex; }
        }

        #loading {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #aaa; font-size: 12px; background: rgba(0,0,0,0.5);
            padding: 5px 10px; border-radius: 4px; z-index: 50;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            margin: -3px 0 0 -3px; background: rgba(255,255,255,0.7);
            border-radius: 50%; pointer-events: none; z-index: 50; display: none;
        }

        /* ==== Иконка корзины для удаления ==== */
        #delete-hint {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(40, 40, 40, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            pointer-events: none; /* управляем вручную через JS-координаты */
            backdrop-filter: blur(4px);
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
            transform: translate(-50%, -50%) scale(0.85);
            opacity: 0;
        }
        #delete-hint.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #delete-hint .mi {
            font-size: 26px;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.15s ease;
        }
        /* Когда курсор/палец наведён на корзину — красная */
        #delete-hint.hover-danger {
            background: rgba(200, 40, 40, 0.95);
            border-color: #ff7070;
        }
        #delete-hint.hover-danger .mi {
            color: #fff;
        }

        /* Тост-подсказка, что нажата M */
        #toast {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn"><span class="mi">play_arrow</span></button>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn" class="action-btn"><span class="mi">north</span></div>
    <div id="fly-btn" class="action-btn"><span class="mi">flight</span></div>

    <div id="settings-btn"><span class="mi">settings</span></div>
    <div id="settings-panel">
        <h3><span class="mi">tune</span></h3>
        <div class="setting-row">
            <label><span class="mi">height</span><span class="val" id="player-size-val">1.00</span></label>
            <input type="range" id="player-size" min="0.3" max="3" step="0.05" value="1">
        </div>
        <div class="setting-row">
            <label><span class="mi">landscape</span><span class="val" id="statue-size-val">1.00</span></label>
            <input type="range" id="statue-size" min="0.5" max="4" step="0.05" value="1">
        </div>
        <div class="setting-row">
            <label><span class="mi">speed</span><span class="val" id="speed-val">5.0</span></label>
            <input type="range" id="speed" min="1" max="20" step="0.5" value="5">
        </div>
        <div class="setting-row">
            <label><span class="mi">arrow_upward</span><span class="val" id="fly-speed-val">5.0</span></label>
            <input type="range" id="fly-speed" min="1" max="20" step="0.5" value="5">
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="loading">Загрузка модели...</div>

    <!-- Иконка корзины -->
    <div id="delete-hint"><span class="mi">delete</span></div>
    <div id="toast"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer;
        let player;
        let playerBody;
        let statueGroup;        // группа-обёртка со статуей
        let statueModel;        // сама модель (gltf.scene)
        let mixer;

        const cam = {
            yaw: 0, pitch: 0,
            sensitivity: 0.0022
        };

        const playerState = {
            velocity: new THREE.Vector3(),
            onGround: true, speed: 5.0, jumpForce: 8.0,
            gravity: 20.0, flying: false, flySpeed: 5.0, scale: 1.0
        };
        const statueState = { scale: 1.0, baseScale: 1.0 };

        const keys = { w:false,a:false,s:false,d:false,space:false,fly:false,sprint:false,up:false,down:false };
        let joystickInput = { x:0, y:0 };

        // Мобильный джойстик
        let joystickActive = false, joystickTouchId = null;
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickCenter = { x: 0, y: 0 };
        const joystickRadius = 55;

        // Кнопки
        const jumpBtn = document.getElementById('jump-btn');
        const flyBtn = document.getElementById('fly-btn');
        let jumpBtnPressed = false;
        let flyToggleOnMobile = false;

        // Касания
        const activeTouches = new Map();
        let cameraTouchId = null;
        let lastCameraTouchX = 0, lastCameraTouchY = 0;

        // ПК мышь
        let isMouseLocked = false;

        // ==== Выбор и удаление частей статуи ====
        let selectedPart = null;              // выбранный mesh
        let selectedOriginalMaterial = null;  // сохранённый оригинальный материал (для восстановления цвета)
        let hoverDeleteBtn = false;           // наведена ли корзина
        const deleteHint = document.getElementById('delete-hint');
        let lastInteractTime = 0;             // время последнего взаимодействия с выделением
        const AUTO_HIDE_MS = 3 * 60 * 1000;   // 3 минуты
        let hideTimer = null;
        let hintVisible = false;
        let lastPointerX = 0, lastPointerY = 0;
        let pointerOnScreen = false;

        const raycaster = new THREE.Raycaster();
        const pointerNdc = new THREE.Vector2();

        // Настройки
        const settingsPanel = document.getElementById('settings-panel');
        const settingsBtn = document.getElementById('settings-btn');
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
                settingsPanel.style.display = 'none';
            }
        });

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6a6a6a);
            scene.fog = new THREE.Fog(0x6a6a6a, 40, 200);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.65));

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            dirLight.shadow.camera.left = -60;
            dirLight.shadow.camera.right = 60;
            dirLight.shadow.camera.top = 60;
            dirLight.shadow.camera.bottom = -60;
            dirLight.shadow.camera.far = 150;
            scene.add(dirLight);

            const fill = new THREE.DirectionalLight(0xffffff, 0.4);
            fill.position.set(-20, 10, -20);
            scene.add(fill);

            // Карта 80x80
            const mapSize = 80;
            const platformGeo = new THREE.BoxGeometry(mapSize, 0.5, mapSize);
            const platformMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.75, metalness: 0.05 });
            const platform = new THREE.Mesh(platformGeo, platformMat);
            platform.position.y = -0.25;
            platform.receiveShadow = true;
            scene.add(platform);

            const grid = new THREE.GridHelper(mapSize, 40, 0x555555, 0x505050);
            grid.position.y = 0.005;
            scene.add(grid);

            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.85 });
            const pillarGeo = new THREE.BoxGeometry(2, 6, 2);
            [[30,30],[-30,30],[30,-30],[-30,-30]].forEach(([x,z]) => {
                const p = new THREE.Mesh(pillarGeo, pillarMat);
                p.position.set(x, 3, z);
                p.castShadow = true; p.receiveShadow = true;
                scene.add(p);
            });

            // Игрок
            player = new THREE.Group();
            player.position.set(0, 0, 8);
            scene.add(player);

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: 0.6 });
            playerBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 4, 8), bodyMat);
            playerBody.position.y = 0.8;
            playerBody.castShadow = true; playerBody.receiveShadow = true;
            player.add(playerBody);

            // Загрузка статуи
            const loader = new GLTFLoader();
            loader.load(
                'fexa_bikini.glb',
                (gltf) => {
                    statueModel = gltf.scene;
                    statueModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            // Сохраняем оригинальный цвет в userData для восстановления
                            if (node.material && node.material.color) {
                                node.userData.originalColor = node.material.color.clone();
                            }
                        }
                    });

                    const box = new THREE.Box3().setFromObject(statueModel);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const targetHeight = 4;
                    const autoScale = targetHeight / (size.y || 1);
                    statueState.baseScale = autoScale;
                    statueState.scale = 1.0;
                    statueModel.scale.setScalar(autoScale);

                    const box2 = new THREE.Box3().setFromObject(statueModel);
                    const center = new THREE.Vector3();
                    box2.getCenter(center);
                    statueModel.position.x = -center.x;
                    statueModel.position.z = -center.z;
                    statueModel.position.y = -box2.min.y;

                    statueGroup = new THREE.Group();
                    statueGroup.position.set(0, 0, -12);
                    statueGroup.add(statueModel);
                    scene.add(statueGroup);

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(statueModel);
                        // не запускаем — стоит неподвижно
                    }

                    document.getElementById('loading').style.display = 'none';
                },
                (xhr) => {
                    if (xhr.total) {
                        const p = (xhr.loaded / xhr.total * 100).toFixed(0);
                        document.getElementById('loading').textContent = `Загрузка: ${p}%`;
                    }
                },
                (err) => {
                    console.error(err);
                    document.getElementById('loading').textContent = 'Ошибка загрузки fexa_bikini.glb';
                }
            );

            setupSettings();
            setupControls();
            window.addEventListener('resize', onWindowResize);
        }

        function setupSettings() {
            const playerSizeInput = document.getElementById('player-size');
            const playerSizeVal = document.getElementById('player-size-val');
            playerSizeInput.addEventListener('input', () => {
                const v = parseFloat(playerSizeInput.value);
                playerSizeVal.textContent = v.toFixed(2);
                playerState.scale = v;
                player.scale.setScalar(v);
            });

            const statueSizeInput = document.getElementById('statue-size');
            const statueSizeVal = document.getElementById('statue-size-val');
            statueSizeInput.addEventListener('input', () => {
                const v = parseFloat(statueSizeInput.value);
                statueSizeVal.textContent = v.toFixed(2);
                statueState.scale = v;
                if (statueModel) statueModel.scale.setScalar(statueState.baseScale * v);
            });

            const speedInput = document.getElementById('speed');
            const speedVal = document.getElementById('speed-val');
            speedInput.addEventListener('input', () => {
                const v = parseFloat(speedInput.value);
                speedVal.textContent = v.toFixed(1);
                playerState.speed = v;
            });

            const flySpeedInput = document.getElementById('fly-speed');
            const flySpeedVal = document.getElementById('fly-speed-val');
            flySpeedInput.addEventListener('input', () => {
                const v = parseFloat(flySpeedInput.value);
                flySpeedVal.textContent = v.toFixed(1);
                playerState.flySpeed = v;
            });
        }

        function setupControls() {
            // Клавиатура
            window.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = true; break;
                    case 'KeyA': keys.a = true; break;
                    case 'KeyS': keys.s = true; break;
                    case 'KeyD': keys.d = true; break;
                    case 'Space': keys.space = true; e.preventDefault(); break;
                    case 'KeyF': keys.fly = true; e.preventDefault(); break;
                    case 'ShiftLeft': case 'ShiftRight': keys.sprint = true; break;
                    case 'KeyE': keys.up = true; break;
                    case 'KeyQ': keys.down = true; break;
                    case 'KeyM': tryDeleteSelected(); e.preventDefault(); break;
                }
            });
            window.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = false; break;
                    case 'KeyA': keys.a = false; break;
                    case 'KeyS': keys.s = false; break;
                    case 'KeyD': keys.d = false; break;
                    case 'Space': keys.space = false; break;
                    case 'KeyF': keys.fly = false; break;
                    case 'ShiftLeft': case 'ShiftRight': keys.sprint = false; break;
                    case 'KeyE': keys.up = false; break;
                    case 'KeyQ': keys.down = false; break;
                }
            });

            const canvas = renderer.domElement;

            // ==== Клик по статуе (левый или правый) ====
            // Используем click — но правый клик тоже должен работать, поэтому отдельно contextmenu + mousedown правой.
            // Проще: слушаем mousedown для кнопок 0 (левая) и 2 (правая). Если попали в статую — выделяем.
            canvas.addEventListener('mousedown', (e) => {
                // Если ещё не в pointer lock — клик захватывает мышь. При этом не мешаем выделению.
                // pointer lock запрашивается по клику, но выделение сделаем до/после.
                if (!isMouseLocked) {
                    canvas.requestPointerLock();
                    // Всё равно пробуем выделить (клик по статуе при первом клике)
                }

                if (e.button === 0 || e.button === 2) {
                    // Обновляем позицию для рейкаста
                    const rect = canvas.getBoundingClientRect();
                    pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    trySelectPart(e.clientX, e.clientY, e.button === 2);
                }
            });

            // Отключаем контекстное меню на правый клик
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // Pointer lock
            document.addEventListener('pointerlockchange', () => {
                isMouseLocked = (document.pointerLockElement === canvas);
            });
            document.addEventListener('mousemove', (e) => {
                // Обновляем позицию курсора для корзины
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
                pointerOnScreen = true;
                updateDeleteHintPosition();

                // Проверяем наведение на корзину
                if (selectedPart && hintVisible) {
                    const rect = deleteHint.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dx = e.clientX - cx;
                    const dy = e.clientY - cy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const hovering = dist < 40;
                    if (hovering !== hoverDeleteBtn) {
                        hoverDeleteBtn = hovering;
                        deleteHint.classList.toggle('hover-danger', hoverDeleteBtn);
                    }
                }

                if (!isMouseLocked) return;
                cam.yaw -= e.movementX * cam.sensitivity;
                cam.pitch -= e.movementY * cam.sensitivity;
                cam.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, cam.pitch));
            });

            // ==== Мобильные касания ====
            canvas.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                }

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    const inJoystickZone = t.clientX < window.innerWidth * 0.5 &&
                                           t.clientY > window.innerHeight * 0.45;

                    if (!joystickActive && inJoystickZone) {
                        joystickActive = true;
                        joystickTouchId = t.identifier;
                        joystickContainer.style.display = 'block';
                        joystickContainer.style.left = '40px';
                        joystickContainer.style.bottom = '40px';
                        joystickContainer.style.top = 'auto';

                        const rect = joystickContainer.getBoundingClientRect();
                        joystickCenter.x = rect.left + rect.width / 2;
                        joystickCenter.y = rect.top + rect.height / 2;

                        joystickKnob.style.transform = 'translate(-50%, -50%)';
                        joystickInput = { x: 0, y: 0 };
                        e.preventDefault();
                    } else if (cameraTouchId === null) {
                        // Одиночный тап по статуе — выделяем. Двойной тап не делаем.
                        // Но если тап попал по статуе, не начинаем вращение камеры.
                        const rect = canvas.getBoundingClientRect();
                        pointerNdc.x = ((t.clientX - rect.left) / rect.width) * 2 - 1;
                        pointerNdc.y = -((t.clientY - rect.top) / rect.height) * 2 + 1;

                        // Проверяем, попали ли в статую
                        if (trySelectPart(t.clientX, t.clientY, false)) {
                            // Попали — не начинаем вращение камеры этим пальцем
                            e.preventDefault();
                            continue;
                        }

                        cameraTouchId = t.identifier;
                        lastCameraTouchX = t.clientX;
                        lastCameraTouchY = t.clientY;
                    }
                }

                // Обновляем позицию корзины для тача
                if (e.changedTouches.length > 0) {
                    lastPointerX = e.changedTouches[0].clientX;
                    lastPointerY = e.changedTouches[0].clientY;
                    updateDeleteHintPosition();
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (activeTouches.has(t.identifier)) {
                        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                    }

                    if (joystickActive && t.identifier === joystickTouchId) {
                        let dx = t.clientX - joystickCenter.x;
                        let dy = t.clientY - joystickCenter.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > joystickRadius) {
                            dx = (dx / dist) * joystickRadius;
                            dy = (dy / dist) * joystickRadius;
                        }
                        joystickInput.x = dx / joystickRadius;
                        joystickInput.y = dy / joystickRadius;
                        joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        e.preventDefault();
                    }

                    if (t.identifier === cameraTouchId) {
                        const dx = t.clientX - lastCameraTouchX;
                        const dy = t.clientY - lastCameraTouchY;
                        lastCameraTouchX = t.clientX;
                        lastCameraTouchY = t.clientY;
                        const sens = 0.004;
                        cam.yaw -= dx * sens;
                        cam.pitch -= dy * sens;
                        cam.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, cam.pitch));
                        e.preventDefault();
                    }
                }

                // Обновляем позицию корзины и проверяем наведение
                if (e.changedTouches.length > 0) {
                    lastPointerX = e.changedTouches[0].clientX;
                    lastPointerY = e.changedTouches[0].clientY;
                    updateDeleteHintPosition();

                    if (selectedPart && hintVisible) {
                        const rect = deleteHint.getBoundingClientRect();
                        const cx = rect.left + rect.width / 2;
                        const cy = rect.top + rect.height / 2;
                        const dx = lastPointerX - cx;
                        const dy = lastPointerY - cy;
                        const hovering = Math.sqrt(dx*dx + dy*dy) < 45;
                        if (hovering !== hoverDeleteBtn) {
                            hoverDeleteBtn = hovering;
                            deleteHint.classList.toggle('hover-danger', hoverDeleteBtn);
                        }
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    activeTouches.delete(t.identifier);

                    if (t.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        joystickInput = { x: 0, y: 0 };
                        joystickContainer.style.display = 'none';
                        joystickKnob.style.transform = 'translate(-50%, -50%)';
                    }
                    if (t.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };
            canvas.addEventListener('touchend', endTouch);
            canvas.addEventListener('touchcancel', endTouch);

            // Кнопки
            const bindBtn = (el, onDown, onUp) => {
                el.addEventListener('touchstart', (e) => { onDown(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
                el.addEventListener('touchend', (e) => { onUp(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
                el.addEventListener('touchcancel', (e) => { onUp(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
                el.addEventListener('mousedown', (e) => { onDown(); e.preventDefault(); });
                el.addEventListener('mouseup', (e) => { onUp(); e.preventDefault(); });
                el.addEventListener('mouseleave', () => onUp());
            };

            bindBtn(jumpBtn, () => jumpBtnPressed = true, () => jumpBtnPressed = false);

            const toggleFly = () => {
                flyToggleOnMobile = !flyToggleOnMobile;
                playerState.flying = flyToggleOnMobile;
                flyBtn.classList.toggle('active', playerState.flying);
            };
            flyBtn.addEventListener('touchstart', (e) => { toggleFly(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
            flyBtn.addEventListener('mousedown', (e) => { toggleFly(); e.preventDefault(); });
        }

        // ==== Выделение части статуи ====
        function trySelectPart(clientX, clientY, isRightClick) {
            if (!statueModel || !statueGroup) return false;

            const rect = renderer.domElement.getBoundingClientRect();
            pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointerNdc, camera);

            // Собираем все меши статуи
            const meshes = [];
            statueModel.traverse((node) => {
                if (node.isMesh && node.visible) meshes.push(node);
            });

            const hits = raycaster.intersectObjects(meshes, false);
            if (hits.length === 0) {
                // Клик мимо статуи — сбрасываем выделение? По ТЗ не сказано, но логично.
                // Оставим выделение, чтобы случайно не сбросить. Но если хочешь сбрасывать — раскомментируй:
                // clearSelection();
                return false;
            }

            const hitMesh = hits[0].object;

            // Если кликнули по той же части — ничего не меняем, но обновляем таймер
            if (selectedPart === hitMesh) {
                resetAutoHideTimer();
                return true;
            }

            // Снимаем подсветку со старой
            if (selectedPart) {
                restorePartColor(selectedPart);
            }

            // Подсвечиваем новую
            selectedPart = hitMesh;
            highlightPart(selectedPart);

            // Позиционируем корзину
            lastPointerX = clientX;
            lastPointerY = clientY;
            updateDeleteHintPosition();

            // Показываем корзину с анимацией
            showDeleteHint();

            // Таймер автоскрытия
            resetAutoHideTimer();

            return true;
        }

        function highlightPart(mesh) {
            if (!mesh.material) return;
            // Сохраняем оригинальный материал (на случай если он разделяемый)
            // Будем менять цвет emissive или просто цвет. Лучше emissive — тогда не теряем текстуру.
            // Но emissive может отсутствовать. Сделаем копию материала и установим emissive.
            if (!mesh.userData._originalMaterial) {
                mesh.userData._originalMaterial = mesh.material;
            }
            // Если материал — массив, берём первый (обычно у GLTF один)
            let mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
            if (mat.emissive) {
                mat.emissive.setHex(0xffaa00);
                mat.emissiveIntensity = 0.8;
            } else {
                // fallback — меняем цвет
                if (mat.color) {
                    if (!mesh.userData._originalColor) mesh.userData._originalColor = mat.color.clone();
                    mat.color.setHex(0xffaa00);
                }
            }
        }

        function restorePartColor(mesh) {
            if (!mesh.material) return;
            let mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
            if (mat.emissive) {
                mat.emissive.setHex(0x000000);
                mat.emissiveIntensity = 0;
            } else {
                if (mesh.userData._originalColor && mat.color) {
                    mat.color.copy(mesh.userData._originalColor);
                }
            }
        }

        function clearSelection() {
            if (selectedPart) {
                restorePartColor(selectedPart);
                selectedPart = null;
            }
            hideDeleteHint();
        }

        function showDeleteHint() {
            hintVisible = true;
            deleteHint.style.display = 'flex';
            // запрашиваем кадр, чтобы transition сработал
            requestAnimationFrame(() => {
                deleteHint.classList.add('visible');
            });
            hoverDeleteBtn = false;
            deleteHint.classList.remove('hover-danger');
        }

        function hideDeleteHint() {
            hintVisible = false;
            deleteHint.classList.remove('visible');
            setTimeout(() => {
                if (!hintVisible) deleteHint.style.display = 'none';
            }, 200);
        }

        function updateDeleteHintPosition() {
            if (!hintVisible) return;
            deleteHint.style.left = lastPointerX + 'px';
            deleteHint.style.top = lastPointerY + 'px';
        }

        function resetAutoHideTimer() {
            lastInteractTime = Date.now();
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                if (selectedPart) {
                    clearSelection();
                }
            }, AUTO_HIDE_MS);
        }

        // ==== Удаление выбранной части ====
        function tryDeleteSelected() {
            // Если курсор наведён на корзину и нажата M — тоже удаляем.
            if (!selectedPart) {
                showToast('Ничего не выбрано');
                return;
            }

            // Проверяем, что selectedPart всё ещё в сцене
            let part = selectedPart;
            let parent = part.parent;
            if (!parent) {
                clearSelection();
                return;
            }

            // Сначала снимаем подсветку, чтобы не влиять на другие
            restorePartColor(part);

            // Удаляем из родителя
            parent.remove(part);

            // Освобождаем ресурсы (геометрию и материал)
            if (part.geometry) part.geometry.dispose();
            if (part.material) {
                if (Array.isArray(part.material)) {
                    part.material.forEach(m => m.dispose());
                } else {
                    part.material.dispose();
                }
            }

            selectedPart = null;
            hideDeleteHint();

            showToast('Часть удалена');
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            updatePlayer(dt);
            renderer.render(scene, camera);
        }

        const _forward = new THREE.Vector3();
        const _right = new THREE.Vector3();
        const _move = new THREE.Vector3();

        function updatePlayer(dt) {
            if (!player) return;

            if (keys.fly) playerState.flying = true;

            let f = 0, r = 0;
            if (keys.w) f += 1;
            if (keys.s) f -= 1;
            if (keys.d) r += 1;
            if (keys.a) r -= 1;

            if (Math.abs(joystickInput.y) > 0.1) f += -joystickInput.y;
            if (Math.abs(joystickInput.x) > 0.1) r += joystickInput.x;

            const inputLen = Math.sqrt(f*f + r*r);
            if (inputLen > 1) { f /= inputLen; r /= inputLen; }

            _forward.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
            _right.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));

            _move.set(0, 0, 0);
            _move.addScaledVector(_forward, f);
            _move.addScaledVector(_right, r);
            if (_move.lengthSq() > 0) _move.normalize();

            const sprintMul = keys.sprint ? 2.0 : 1.0;

            if (playerState.flying) {
                const flySpeed = playerState.flySpeed * sprintMul;
                player.position.x += _move.x * flySpeed * dt;
                player.position.z += _move.z * flySpeed * dt;

                let vertical = 0;
                if (keys.space || jumpBtnPressed) vertical += 1;
                if (keys.down) vertical -= 1;
                player.position.y += vertical * flySpeed * dt;

                player.position.y = Math.max(0, Math.min(50, player.position.y));
                if (player.position.y < 0) player.position.y = 0;
            } else {
                const speed = playerState.speed * sprintMul;
                player.position.x += _move.x * speed * dt;
                player.position.z += _move.z * speed * dt;

                if ((keys.space || jumpBtnPressed) && playerState.onGround) {
                    playerState.velocity.y = playerState.jumpForce;
                    playerState.onGround = false;
                }

                playerState.velocity.y -= playerState.gravity * dt;
                player.position.y += playerState.velocity.y * dt;

                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerState.velocity.y = 0;
                    playerState.onGround = true;
                }
            }

            const limit = 39;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            // Камера от первого лица
            const eyeHeight = 1.6 * playerState.scale;
            camera.position.set(
                player.position.x,
                player.position.y + eyeHeight,
                player.position.z
            );

            const dir = new THREE.Vector3(
                -Math.sin(cam.yaw) * Math.cos(cam.pitch),
                Math.sin(cam.pitch),
                -Math.cos(cam.yaw) * Math.cos(cam.pitch)
            );
            camera.lookAt(camera.position.clone().add(dir));

            if (mixer) mixer.update(dt);
        }

        // Старт
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            } catch (err) { console.log(err); }

            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); }
                catch (err) { console.log(err); }
            }

            initScene();
            clock.start();
            animate();
        });
    </script>
</body>
</html>
