<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Карта - fexa_bikini</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333;
            touch-action: none; /* Важно для мобильных, чтобы не скроллилось */
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ccc;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
        }
        /* Стили для джойстика */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: none; /* Скрыт на ПК */
            pointer-events: none; /* Чтобы не мешал канвасу, но мы будем ловить события на канвасе */
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        /* Стили для кнопки прыжка */
        #jump-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: none; /* Скрыт на ПК */
            align-items: center;
            justify-content: center;
            z-index: 100;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            backdrop-filter: blur(2px);
            pointer-events: auto; /* Кнопка должна ловить клики */
        }
        #jump-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        /* Стартовый экран */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        #start-screen h1 {
            font-size: 24px;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        /* Скрываем элементы управления на устройствах с мышью, но показываем на тач-устройствах */
        @media (pointer: fine) {
            #joystick-container, #jump-btn {
                display: none !important;
            }
        }
        @media (pointer: coarse) {
            #joystick-container, #jump-btn {
                display: flex;
            }
        }
        /* Индикатор загрузки модели */
        #loading {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div id="start-screen">
        <h1>Нажмите, чтобы играть на полный экран</h1>
        <button id="start-btn">Играть</button>
    </div>

    <!-- Элементы управления для мобильных -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn">JUMP</div>

    <!-- Подсказка для ПК -->
    <div id="info">WASD - движение | Space - прыжок</div>
    <div id="loading">Загрузка модели...</div>

    <!-- Подключаем Three.js и загрузчик через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Основные глобальные переменные ---
        let scene, camera, renderer;
        let player; // Группа для игрока (модель + камера)
        let model; // Загруженная модель fexa_bikini
        let mixer; // Для анимаций, если они есть

        // Состояние игрока
        const playerState = {
            velocity: new THREE.Vector3(),
            direction: new THREE.Vector3(),
            onGround: true,
            speed: 5.0,
            jumpForce: 8.0,
            gravity: 20.0
        };

        // Ввод
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let joystickInput = { x: 0, y: 0 }; // Нормализованные значения от джойстика (-1..1)

        // Переменные для джойстика
        let joystickActive = false;
        let joystickTouchId = null;
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickCenter = { x: 0, y: 0 };
        const joystickRadius = 50; // Максимальное смещение кноба

        // Переменные для кнопки прыжка
        const jumpBtn = document.getElementById('jump-btn');
        let jumpBtnPressed = false;

        // --- Инициализация сцены ---
        function initScene() {
            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x666666); // Серое небо
            scene.fog = new THREE.Fog(0x666666, 20, 100); // Легкий туман для атмосферы

            // Камера
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; // Включаем тени, если модель их поддерживает
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            dirLight.receiveShadow = true;
            scene.add(dirLight);

            // Добавляем еще немного света для равномерности
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-5, 0, 5);
            scene.add(fillLight);

            // --- Создаем простую 3D-карту ---
            // Темно-серая платформа
            const platformGeometry = new THREE.BoxGeometry(30, 0.5, 30);
            const platformMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7, metalness: 0.1 });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.y = -0.25; // Чтобы верхняя грань была на y=0
            platform.receiveShadow = true;
            scene.add(platform);

            // Добавим немного деталей: пара колонн или кубов для ориентира
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
            const pillarGeo = new THREE.BoxGeometry(1, 3, 1);

            const pillar1 = new THREE.Mesh(pillarGeo, pillarMat);
            pillar1.position.set(8, 1.5, 8);
            pillar1.castShadow = true;
            pillar1.receiveShadow = true;
            scene.add(pillar1);

            const pillar2 = new THREE.Mesh(pillarGeo, pillarMat);
            pillar2.position.set(-8, 1.5, 8);
            pillar2.castShadow = true;
            pillar2.receiveShadow = true;
            scene.add(pillar2);

            const pillar3 = new THREE.Mesh(pillarGeo, pillarMat);
            pillar3.position.set(8, 1.5, -8);
            pillar3.castShadow = true;
            pillar3.receiveShadow = true;
            scene.add(pillar3);

            const pillar4 = new THREE.Mesh(pillarGeo, pillarMat);
            pillar4.position.set(-8, 1.5, -8);
            pillar4.castShadow = true;
            pillar4.receiveShadow = true;
            scene.add(pillar4);

            // Создаем контейнер для игрока (чтобы камера следовала за ним)
            player = new THREE.Group();
            player.position.set(0, 0, 5); // Начальная позиция
            scene.add(player);

            // Загружаем модель fexa_bikini.glb
            const loader = new GLTFLoader();
            loader.load(
                'fexa_bikini.glb', // Путь к файлу (должен лежать рядом с html)
                (gltf) => {
                    model = gltf.scene;
                    // Настраиваем модель
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    // Масштабируем и позиционируем модель относительно игрока
                    // Подгоняем размер, если модель слишком большая или маленькая
                    // Можно раскомментировать и настроить под свою модель:
                    // model.scale.set(0.5, 0.5, 0.5);
                    model.position.set(0, 0, 0); // Центр модели на полу
                    player.add(model);

                    // Если есть анимации, можно запустить
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        // Например, запускаем первую анимацию (если это idle)
                        // mixer.clipAction(gltf.animations[0]).play();
                    }

                    document.getElementById('loading').style.display = 'none';
                },
                (xhr) => {
                    // Прогресс загрузки
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                    document.getElementById('loading').textContent = `Загрузка модели: ${percent}%`;
                },
                (error) => {
                    console.error('Ошибка загрузки модели:', error);
                    document.getElementById('loading').textContent = 'Ошибка загрузки модели. Проверьте файл fexa_bikini.glb';
                }
            );

            // Обработчики событий
            window.addEventListener('resize', onWindowResize);
            setupControls();
        }

        // --- Управление ---
        function setupControls() {
            // Клавиатура для ПК
            window.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = true; break;
                    case 'KeyA': keys.a = true; break;
                    case 'KeyS': keys.s = true; break;
                    case 'KeyD': keys.d = true; break;
                    case 'Space': keys.space = true; e.preventDefault(); break;
                }
            });
            window.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = false; break;
                    case 'KeyA': keys.a = false; break;
                    case 'KeyS': keys.s = false; break;
                    case 'KeyD': keys.d = false; break;
                    case 'Space': keys.space = false; break;
                }
            });

            // --- Обработка джойстика (касания на канвасе) ---
            // Мы используем события на канвасе, чтобы джойстик работал в любой точке экрана
            const canvas = renderer.domElement;

            // Начало касания
            canvas.addEventListener('touchstart', (e) => {
                // Если это первое касание и оно не на кнопке прыжка (кнопка прыжка обрабатывается отдельно)
                // Для простоты: если касание в левой половине экрана, активируем джойстик
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const touchX = touch.clientX;
                    const touchY = touch.clientY;
                    const screenWidth = window.innerWidth;
                    
                    // Если касание в левой половине экрана и джойстик еще не активен
                    if (!joystickActive && touchX < screenWidth / 2) {
                        joystickActive = true;
                        joystickTouchId = touch.identifier;
                        
                        // Показываем джойстик в месте касания (или можно зафиксировать в углу)
                        // Для лучшего UX сделаем джойстик плавающим (появляется там, где коснулись)
                        joystickContainer.style.display = 'block';
                        joystickContainer.style.left = (touchX - 60) + 'px';
                        joystickContainer.style.bottom = 'auto';
                        joystickContainer.style.top = (touchY - 60) + 'px';
                        
                        // Обновляем центр для расчетов
                        const rect = joystickContainer.getBoundingClientRect();
                        joystickCenter.x = rect.left + rect.width / 2;
                        joystickCenter.y = rect.top + rect.height / 2;
                        
                        // Сбрасываем кноб
                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                        joystickInput = { x: 0, y: 0 };
                        
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            // Движение касания
            canvas.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        const touchX = touch.clientX;
                        const touchY = touch.clientY;
                        
                        // Вычисляем смещение от центра
                        let deltaX = touchX - joystickCenter.x;
                        let deltaY = touchY - joystickCenter.y;
                        
                        // Ограничиваем длину вектора
                        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                        const maxDist = joystickRadius;
                        
                        if (distance > maxDist) {
                            deltaX = (deltaX / distance) * maxDist;
                            deltaY = (deltaY / distance) * maxDist;
                        }
                        
                        // Нормализуем для ввода (-1..1)
                        joystickInput.x = deltaX / maxDist;
                        joystickInput.y = deltaY / maxDist;
                        
                        // Визуально двигаем кноб
                        joystickKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
                        
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            // Конец касания
            const endTouch = (e) => {
                if (!joystickActive) return;
                
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        joystickInput = { x: 0, y: 0 };
                        
                        // Скрываем джойстик и возвращаем кноб в центр
                        joystickContainer.style.display = 'none';
                        joystickKnob.style.transform = `translate(-50%, -50%)`;
                        
                        e.preventDefault();
                    }
                }
            };

            canvas.addEventListener('touchend', endTouch);
            canvas.addEventListener('touchcancel', endTouch);

            // --- Кнопка прыжка ---
            // Обрабатываем нажатие на кнопку прыжка (касание)
            jumpBtn.addEventListener('touchstart', (e) => {
                jumpBtnPressed = true;
                e.preventDefault();
                e.stopPropagation(); // Чтобы не активировать джойстик
            }, { passive: false });

            jumpBtn.addEventListener('touchend', (e) => {
                jumpBtnPressed = false;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });

            jumpBtn.addEventListener('touchcancel', (e) => {
                jumpBtnPressed = false;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });

            // Для мыши на кнопке прыжка (если открыто на ПК с тачскрином, но не обязательно)
            jumpBtn.addEventListener('mousedown', (e) => {
                jumpBtnPressed = true;
                e.preventDefault();
            });
            jumpBtn.addEventListener('mouseup', (e) => {
                jumpBtnPressed = false;
                e.preventDefault();
            });
            jumpBtn.addEventListener('mouseleave', (e) => {
                jumpBtnPressed = false;
            });
        }

        // --- Логика обновления ---
        function updatePlayer(deltaTime) {
            if (!player) return;

            // Определяем направление движения
            let moveX = 0;
            let moveZ = 0;

            // Ввод с клавиатуры (ПК)
            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            // Ввод с джойстика (мобильные)
            // joystickInput.x: -1 (влево) до 1 (вправо)
            // joystickInput.y: -1 (вверх) до 1 (вниз)
            if (Math.abs(joystickInput.x) > 0.1) moveX += joystickInput.x;
            if (Math.abs(joystickInput.y) > 0.1) moveZ += joystickInput.y;

            // Нормализуем вектор движения, чтобы не было быстрее по диагонали
            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (length > 1) {
                moveX /= length;
                moveZ /= length;
            }

            // Применяем скорость
            const speed = playerState.speed;
            const moveDelta = new THREE.Vector3(moveX * speed * deltaTime, 0, moveZ * speed * deltaTime);

            // Поворот игрока в сторону движения (плавно)
            if (length > 0.1) {
                const targetAngle = Math.atan2(moveX, moveZ);
                // Плавный поворот
                const currentAngle = player.rotation.y;
                let angleDiff = targetAngle - currentAngle;
                // Нормализуем угол
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                player.rotation.y += angleDiff * Math.min(1, deltaTime * 10);
            }

            // Двигаем игрока (по горизонтали)
            player.position.x += moveDelta.x;
            player.position.z += moveDelta.z;

            // Ограничиваем движение пределами платформы (30x30, от -15 до 15)
            const limit = 14.5;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            // --- Прыжок и гравитация ---
            // Проверяем прыжок (Space на ПК или кнопка на мобильном)
            const jumpPressed = keys.space || jumpBtnPressed;
            
            if (jumpPressed && playerState.onGround) {
                playerState.velocity.y = playerState.jumpForce;
                playerState.onGround = false;
            }

            // Применяем гравитацию
            playerState.velocity.y -= playerState.gravity * deltaTime;
            player.position.y += playerState.velocity.y * deltaTime;

            // Проверка приземления (пол на y=0)
            if (player.position.y <= 0) {
                player.position.y = 0;
                playerState.velocity.y = 0;
                playerState.onGround = true;
            }

            // Обновляем камеру, чтобы она следовала за игроком
            // Камера сзади и чуть сверху
            const cameraOffset = new THREE.Vector3(0, 4, 8);
            // Поворачиваем смещение вместе с игроком (камера сзади)
            const rotatedOffset = cameraOffset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            const targetCameraPos = player.position.clone().add(rotatedOffset);
            
            // Плавное следование камеры
            camera.position.lerp(targetCameraPos, 0.1);
            
            // Камера смотрит на игрока (чуть выше)
            const lookAtTarget = player.position.clone().add(new THREE.Vector3(0, 1.5, 0));
            camera.lookAt(lookAtTarget);

            // Обновляем анимации, если есть
            if (mixer) {
                mixer.update(deltaTime);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Анимационный цикл ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = Math.min(clock.getDelta(), 0.1); // Ограничиваем deltaTime, чтобы избежать рывков

            if (player) {
                updatePlayer(deltaTime);
            }

            renderer.render(scene, camera);
        }

        // --- Запуск после нажатия кнопки "Играть" ---
        document.getElementById('start-btn').addEventListener('click', async () => {
            // Скрываем стартовый экран
            document.getElementById('start-screen').style.display = 'none';

            // Запрашиваем полноэкранный режим
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    await document.documentElement.msRequestFullscreen();
                }
            } catch (err) {
                console.log('Fullscreen request failed:', err);
            }

            // Блокируем ориентацию (если поддерживается)
            if (screen.orientation && screen.orientation.lock) {
                try {
                    await screen.orientation.lock('landscape');
                } catch (err) {
                    console.log('Orientation lock failed:', err);
                }
            }

            // Инициализируем сцену
            initScene();

            // Запускаем анимацию
            clock.start();
            animate();
        });

        // На всякий случай, если пользователь уже на ПК, можно запустить без запроса фуллскрина
        // Но по ТЗ нужно именно после нажатия. Оставляем как есть.

    </script>
</body>
</html>
